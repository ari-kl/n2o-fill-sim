# A fill and hold on the HF4 stand run by a controller instead of a fixed schedule (docs/STUDIES.md,
# "Control policies"): fill to 9 kg, a vent that holds the tank between 770 and 800 psig, a mark
# once the tank has sat in a band for 30 s, then a 600 s hold. Two vent settings are compared, and
# a case freezes the vent's gauge reading at the mark.
scene = "../scenes/hf4.toml"
until = { step = "hold", edge = "end", max_s = 3600 }
work_limit = 20000000

[[case]]
name = "nominal"
[[case]]
name = "frozen_gauge"
actions = [{ mark = "ready", reading = "PT202.P_read", fault = "freeze" }]

[controller]
dt = 0.2
stand_ins = ["TANK.m"]                        # no load cell on this stand: the fill stops on the true mass
noise = { "PT202.P_read" = { sigma_psi = 1 } }

[[controller.step]]
name = "fill"
on_enter = [{ part = "AV203", action = "open" }, { part = "AV201", action = "open" }]
on_exit = [{ part = "AV201", action = "close" }]
until = { reading = "TANK.m", ge = 9.0 }
timeout_s = 1200

[[controller.step]]
name = "hold"
duration_s = 600
enable = ["ready"]

[[controller.policy]]
name = "vent"
kind = "hysteresis"
reading = "PT202.P_read"
actuator = "AV204"
open_above_psig = 800
close_below_psig = 770
min_open_s = 1
min_shut_s = 5

[[controller.policy]]
name = "ready"
kind = "band_watch"
enabled = false
reading = "PT202.P_read"
lo_psig = 760
hi_psig = 810
hold_s = 30

[vary]
"controller.vent.close_below_psig" = [770, 785]

[metrics]
fill_s = { fn = "step_s", step = "fill" }
ready_s = { fn = "t_mark", mark = "ready", from = { step = "fill", edge = "end" } }
vent_cycles = { fn = "cycles", actuator = "AV204", from = { step = "hold" } }
vent_duty = { fn = "duty", actuator = "AV204", from = { step = "hold" } }
in_band = { fn = "time_in_band_frac", signal = "TANK.P", lo_psig = 760, hi_psig = 810, from = { mark = "ready" } }
prv_margin_psi = { fn = "prv_margin_psi", part = "PRV202", signal = "TANK.P" }
m_ready_300 = { fn = "m_at", signal = "TANK.m", at = { mark = "ready", plus_s = 300 } }
m_fire = { fn = "m_at_fire", signal = "TANK.m" }
