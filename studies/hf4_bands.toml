# Step 2 of a prediction band (docs/STUDIES.md, "Prediction bands"): the parameter sets that
# studies/hf4_sample.toml could not rule out, each run again, and the spread of the tank's pressure
# and mass over them at every second. Here the scenario is the HF4 fill itself; to predict another,
# name its scene and its schedule or log instead.
#   julia -t 8 --project bin/n2o-fill-sim.jl study studies/hf4_bands.toml
#   julia --project bin/n2o-fill-sim.jl scenes/hf4.toml --replay test/data/hf4_fill_10hz.csv --t0 9020 --run --bands studies/hf4_bands_results/bands.csv
scene = "../scenes/hf4.toml"
replay = "../test/data/hf4_fill_10hz.csv"
t0 = 9020
until = 990
mode = "sets"
sets = "hf4_sample_results/kept.csv"

[metrics]
loaded_kg = { fn = "final", signal = "TANK.m" }
peak_psig = { fn = "max", signal = "TANK.P", unit = "psig" }

[bands]
signals = ["TANK.P", "TANK.m"]
percentiles = [5, 50, 95]
grid_s = 1.0
