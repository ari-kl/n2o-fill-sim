# Hot-day regulated fill: the HF4 plumbing with a regulator added after the supply hose, a 30 °C
# bottle, sun on the tank and no heater. The schedule fills with the vent open, then closes up at
# 90 s; after that the tank warms and its pressure drifts up.
# Hardware numbers are the HF4 fits and guesses (see scenes/hf4.toml). Units are in the names.

[settings]
T_amb_C          = 30.0       # ambient air temperature
solar_W_m2       = 800.0      # solar flux on exposed surfaces (clear summer noon ≈ 900)
wind_m_s         = 1.0        # wind speed
P_atm_kPa        = 101.325    # local atmospheric pressure; gauge readings are relative to this
meop_psig        = 1000.0     # maximum expected operating pressure (warning threshold)
interphase_E     = 700.0      # boiling enhancement on liquid-to-surface heat transfer (Zilliac-Karabeyoglu E; fitted, literature 240-1300)
cond_tau_s       = 0.5        # time constant for supersaturated ullage vapour to condense
h_in_mult        = 0.63       # multiplier on wall-to-fluid natural convection inside vessels (as calibrated on HF4)
h_ext_mult       = 1.0        # multiplier on outside convection (0 = perfectly insulated)

